<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz aniversario mi amorciño ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdfb; --ink:#141414; --muted:#7d6f6a; --red:#e2373f; --red-d:#a8222a; --pink:#f7a9b4;
    --gold:#e9b54a; --cream:#fff6ee; --line:#141414; --px:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans",monospace;font-size:18px}
  body{min-height:100vh;display:flex;justify-content:center;padding:20px 14px 70px;
    background-image:radial-gradient(var(--gold) 1.5px,transparent 1.5px);background-size:46px 46px;background-position:0 0}
  .wrap{width:100%;max-width:560px}
  .pixel{font-family:"Press Start 2P",monospace;line-height:1.6}
  h1{font-family:"Press Start 2P",monospace;font-size:20px;line-height:1.6;margin:0;letter-spacing:.02em}
  h2{font-family:"Press Start 2P",monospace;font-size:14px;line-height:1.8;margin:0}
  p{line-height:1.45;margin:0}
  .muted{color:var(--muted)}
  img.sprite{image-rendering:pixelated;display:block}

  /* pixel box with notched corners */
  .box{position:relative;background:#fff;margin:var(--px);padding:22px 18px;
    box-shadow:0 calc(-1*var(--px)) 0 0 var(--line),0 var(--px) 0 0 var(--line),calc(-1*var(--px)) 0 0 0 var(--line),var(--px) 0 0 0 var(--line),
               0 calc(2*var(--px)) 0 0 rgba(20,20,20,.15)}
  .btn{font-family:"Press Start 2P",monospace;font-size:11px;letter-spacing:.04em;border:0;cursor:pointer;color:#fff;background:var(--red);
    padding:14px 18px;margin:var(--px);
    box-shadow:0 calc(-1*var(--px)) 0 0 var(--line),0 var(--px) 0 0 var(--line),calc(-1*var(--px)) 0 0 0 var(--line),var(--px) 0 0 0 var(--line),
               inset 0 calc(-1*var(--px)) 0 0 var(--red-d),inset var(--px) var(--px) 0 0 rgba(255,255,255,.35)}
  .btn:active{transform:translateY(2px)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 calc(-1*var(--px)) 0 0 var(--line),0 var(--px) 0 0 var(--line),calc(-1*var(--px)) 0 0 0 var(--line),var(--px) 0 0 0 var(--line),inset 0 calc(-1*var(--px)) 0 0 #e8ded8}
  .btn.small{font-size:9px;padding:9px 11px}
  .blink{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .bob{animation:bob 1.2s steps(2) infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}

  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab{flex:1}
  .tab.on{background:var(--ink);color:#fff;box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}

  .hearts{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:6px 0 18px}
  .bar{display:flex;gap:4px;margin-bottom:20px}
  .bar i{flex:1;height:12px;background:#eee4de;box-shadow:inset 0 0 0 2px var(--line)}
  .bar i.on{background:var(--red)}
  .qtag{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--red);margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:#fff;border:0;padding:8px 8px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;margin:var(--px);position:relative;
    box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}
  .card .pic{aspect-ratio:1/1;background:var(--cream);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
  .card .pic img.photo{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  .card .name{font-weight:600;font-size:17px;line-height:1.2}
  .card .desc{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.3}
  .card.on{background:#ffeef0;box-shadow:0 -4px 0 0 var(--red),0 4px 0 0 var(--red),-4px 0 0 0 var(--red),4px 0 0 0 var(--red),0 0 0 8px #ffd3d9}
  .card .check{position:absolute;top:-10px;right:-10px;display:none}
  .card.on .check{display:block}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .scale .card{text-align:center;padding:12px 0;font-family:"Press Start 2P";font-size:12px}
  textarea,input[type=text],select{width:100%;font:18px "Pixelify Sans",monospace;color:var(--ink);background:#fff;border:0;outline:none;padding:12px;margin:var(--px);width:calc(100% - 8px);
    box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}
  textarea:focus,input[type=text]:focus,select:focus{box-shadow:0 -4px 0 0 var(--red),0 4px 0 0 var(--red),-4px 0 0 0 var(--red),4px 0 0 0 var(--red)}
  textarea{min-height:110px;resize:vertical}
  .note{margin-top:18px}
  .note label{font-size:15px;color:var(--muted);display:block;margin-bottom:6px}
  .note textarea{min-height:64px}
  .nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
  .fade{animation:fade .3s steps(4)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .center{text-align:center}

  /* editor */
  .qedit{background:#fff;padding:14px;margin:var(--px) var(--px) 18px;box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line);display:grid;gap:10px}
  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .icon{border:0;background:transparent;cursor:pointer;font:600 18px "Pixelify Sans";color:var(--muted);padding:4px 8px}
  .icon:hover{color:var(--ink)}
  .oedit{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:start;padding:8px;background:var(--cream)}
  .thumb{width:64px;height:64px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);position:relative}
  .thumb img.photo{max-width:100%;max-height:100%;object-fit:contain}
  .thumb .up{position:absolute;bottom:0;left:0;right:0;font:9px "Press Start 2P";background:rgba(20,20,20,.75);color:#fff;text-align:center;padding:3px 0}
  .oedit input[type=text]{font-size:15px;padding:8px;margin:2px 4px 6px}
  label.small{font-size:14px;color:var(--muted);display:block;margin:0 4px 2px}
  .tag{font:9px "Press Start 2P";background:var(--red);color:#fff;padding:5px 8px}

  .sub{background:#fff;padding:16px;margin:var(--px) var(--px) 18px;box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}
  .sub .item{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:2px dashed #e5d9d2}
  .sub .item:first-of-type{border-top:0}
  .sub .item .pic{width:56px;height:56px;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sub .item .pic img.photo{max-width:100%;max-height:100%;object-fit:contain}
  .sub .q{font-size:14px;color:var(--muted)}
  .sub .a{font-size:17px;font-weight:600}
  .sub .n{font-size:15px;margin-top:2px;white-space:pre-wrap}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font:10px "Press Start 2P";opacity:0;transition:opacity .2s steps(2);pointer-events:none;z-index:9}
  .toast.on{opacity:1}

  .duo{position:relative;display:flex;justify-content:center;margin:0 auto 14px;height:var(--h,300px)}
  .duo img.art{height:100%;width:auto;image-rendering:pixelated;}
  @keyframes breathe{50%{transform:translateY(-3px) scaleY(1.012)}}
  .duo .fx{position:absolute;bottom:55%;left:50%;opacity:0;animation:rise 3.2s steps(8) infinite}
  @keyframes rise{0%{opacity:0;transform:translate(var(--x),0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),-150px)}}
  .duo .tw{position:absolute;animation:tw 1.2s steps(2) infinite}
  @keyframes tw{50%{opacity:.15}}
  .mini{height:56px;width:auto;image-rendering:pixelated}
  @keyframes hop{50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.duo img.art,.duo .fx,.duo .tw,.mini,.bob,.blink{animation:none!important}.duo .fx{display:none}}
  @keyframes burst{to{transform:translateY(-110vh)}}
  .box.scene{padding:0;overflow:hidden}
  .stage{position:relative;height:270px;overflow:hidden;margin:0;background-repeat:no-repeat;background-size:600px 270px;background-position:center bottom;image-rendering:pixelated}
  .walker{position:absolute;bottom:14px;left:0;width:112px;height:152px;background-repeat:no-repeat;image-rendering:pixelated;will-change:transform}
  .floor{position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#f3e3d3 0 8px,#ead5c2 8px 16px);box-shadow:inset 0 4px 0 #e2c9b3}
  .popheart{position:absolute;top:84px;animation:pop .9s steps(3) infinite alternate}
  @keyframes pop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  .kissheart{position:absolute;top:70px;z-index:3;animation:kiss .9s steps(4) forwards}
  @keyframes kiss{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .kissmini{position:absolute;top:110px;z-index:3;opacity:0;animation:rise2 1.4s steps(7) forwards}
  @keyframes rise2{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translateY(-90px)}}
  .flash{position:fixed;inset:0;background:#fff;z-index:20;pointer-events:none;animation:flash 1s steps(5) forwards}
  @keyframes flash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
  .benbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;height:112px;overflow:hidden;pointer-events:none;z-index:7;background:linear-gradient(rgba(255,253,251,0),rgba(255,253,251,.95) 60%)}
  body.withben{padding-bottom:120px}
  .benbar::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:4px;background:repeating-linear-gradient(90deg,#e8d6c4 0 8px,transparent 8px 14px)}
  .ben,.benw{position:absolute;bottom:6px;left:0;width:80px;height:72px;background:url(img/ben.png) no-repeat;background-size:320px 360px;image-rendering:pixelated;z-index:1}
  .benw{bottom:14px}
  .dialog{position:relative;text-align:left;background:#1d1a2e;color:#fff;padding:16px 16px 22px;margin:4px;min-height:96px;
    box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,0 -8px 0 var(--ink),0 8px 0 var(--ink),-8px 0 0 var(--ink),8px 0 0 var(--ink)}
  .dialog .d1{font:600 20px "Pixelify Sans",monospace;color:#ff8c96;margin:0 0 8px;min-height:24px}
  .dialog .d2{font:13px/1.8 "Press Start 2P",monospace;margin:0;min-height:24px}
  .dialog .lyric{font:500 17px/1.45 "Pixelify Sans",monospace;color:#f6e7c8;min-height:0}
  .dialog .d1.lyric{margin-bottom:6px}
  .dialog .dnext{position:absolute;right:12px;bottom:6px;font-size:12px;animation:blink 1s steps(2,start) infinite}
  .wedcard{margin:22px 4px 4px;padding:16px;background:#fff9f0;text-align:left;box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink)}
  .wedcard h3{font:11px/1.6 "Press Start 2P",monospace;text-align:center;color:var(--red);margin:0 0 12px}
  .wedrow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px 0;border-top:2px dashed #ead9c8}
  .wedrow:first-of-type{border-top:0}
  .wedrow .pic{width:52px;height:52px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px var(--ink)}
  .wedrow .pic img.photo{max-width:100%;max-height:100%;object-fit:contain}
  .wedrow .k{font:8px/1.6 "Press Start 2P",monospace;color:var(--muted)}
  .wedrow .v{font-size:17px;font-weight:600}
  .bubble{position:absolute;z-index:8;font:9px "Press Start 2P",monospace;background:#fff;color:var(--ink);padding:6px 7px;white-space:nowrap;
    box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink);animation:bub 1.4s steps(6) forwards}
  .bubble::after{content:"";position:absolute;left:10px;bottom:-6px;width:4px;height:4px;background:var(--ink);box-shadow:2px -2px 0 #fff}
  @keyframes bub{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
  .mute{position:fixed;top:10px;right:10px;z-index:9;font-size:8px;padding:8px 9px}
  .hidden{display:none!important}
  @media (max-width:380px){ .grid{gap:10px} .card .name{font-size:15px} }
</style>

<body>
<div class="wrap">
  <div id="tabs" class="tabs hidden">
    <button class="btn small tab on" data-v="play">Jugar</button>
    <button class="btn small ghost tab" data-v="edit">Editar</button>
    <button class="btn small ghost tab" data-v="answers">Respuestas</button>
  </div>
  <div id="view" class="box center"><p class="pixel" style="font-size:10px">LOADING<span class="blink">_</span></p></div>
  <div id="benbar" class="benbar hidden"><div class="ben" id="ben"></div><div class="ben" id="perra"></div></div>
</div>
<input type="file" id="file" accept="image/*" class="hidden">
<div id="toast" class="toast"></div>
<button id="mute" class="btn small ghost mute">♪ ON</button>

<script>
/* ===== Configuración ===== */
const FORM_URL = "https://formspree.io/f/xljbornz";
const QUESTIONS = [{"id": "anillo", "icon": "ring", "order": 0, "text": "¿Cuál anillo te gusta más?", "type": "choice", "options": [{"desc": "Dos bandas finitas que se cruzan, con brillantes salpicados como una ramita", "img": "img/anillo1.jpg", "label": "Enredadera"}, {"desc": "Banda de oro trenzada con una sola piedrita en el centro, súper delicado", "img": "img/anillo2.jpg", "label": "Twist con un brillante"}, {"desc": "Uno para cada una: distintos pero de la misma familia, con piedra central y banda con brillitos", "img": "img/anillo3.jpg", "label": "Dúo a juego"}, {"desc": "Piedra ovalada rosa clarito con florcitas de brillantes a los costados, aire antiguo", "img": "img/anillo4.jpg", "label": "Vintage rosado"}, {"desc": "Brillante central con piedritas desparramadas como estrellas", "img": "img/anillo5.jpg", "label": "Constelación"}, {"desc": "Piedra redonda grande sobre una banda twist con brillitos finos", "img": "img/anillo6.jpg", "label": "Solitario trenzado"}]}, {"id": "propuesta", "icon": "box", "order": 1, "text": "¿Cómo sería la propuesta ideal?", "type": "choice", "options": [{"desc": "Al atardecer, con el sol cayendo sobre el mar", "img": "img/propuesta_playa.png", "label": "En la playa"}, {"desc": "Arriba de todo, con las montañas y la ciudad a nuestros pies", "img": "img/propuesta_mirador.png", "label": "Mirador con vista"}, {"desc": "Nuestro living lleno de velas y pétalos", "img": "img/propuesta_velas.png", "label": "En casa con velas"}, {"desc": "De noche, con una mantita, lucecitas y el cielo lleno de estrellas", "img": "img/propuesta_estrellas.png", "label": "Bajo las estrellas"}, {"desc": "Mantel a cuadros, canasta y un campo lleno de flores", "img": "img/propuesta_picnic.png", "label": "Picnic entre flores"}, {"desc": "Flotando al amanecer, solas las dos sobre las nubes", "img": "img/propuesta_globo.png", "label": "Globo aerostático"}]}, {"id": "ceremonia", "icon": "chapel", "order": 2, "text": "¿Qué ceremonia te imaginás?", "type": "choice", "options": [{"desc": "Firma, alfombra roja, lluvia de pétalos y brindis con las más cercanas", "img": "img/ceremonia_civil.png", "label": "Registro civil"}, {"desc": "Arco de flores, pies en la arena y el mar de fondo", "img": "img/ceremonia_playa.png", "label": "En la playa"}, {"desc": "Viñedo, mesas largas y guirnaldas de luces", "img": "img/ceremonia_campo.png", "label": "En el campo"}, {"desc": "Bola de espejos, pista llena y baile hasta tarde", "img": "img/ceremonia_fieston.png", "label": "Fiestón"}, {"desc": "Viajamos todas y todos a una isla para casarnos", "img": "img/ceremonia_destino.png", "label": "Boda destino"}, {"desc": "Nos casamos a escondidas y salimos en auto con latitas atadas", "img": "img/ceremonia_fuga.png", "label": "Fugarnos"}]}, {"id": "outfit", "icon": "heart", "order": 3, "text": "¿Qué outfit de boda te gusta más?", "type": "choice", "options": [{"desc": "Chaleco y pantalón de pierna ancha, elegante y moderno", "img": "img/outfit1.jpg", "label": "Traje de satén"}, {"desc": "Vestido corto de tul con mangas globo y mocasines", "img": "img/outfit2.jpg", "label": "Mini romántica"}, {"desc": "Vestido corto con moños en los hombros, fresco y relajado", "img": "img/outfit3.jpg", "label": "Mini con moños"}, {"desc": "Vestido liso de breteles finos, con tajo y velo de catedral", "img": "img/outfit4.jpg", "label": "Satén con velo largo"}, {"desc": "Dos piezas de satén: top corto y pantalón súper amplio", "img": "img/outfit5.jpg", "label": "Top y palazzo"}, {"desc": "Vestido de tul con corset, tajo y botas negras", "img": "img/outfit6.jpg", "label": "Boho con borcegos"}]}, {"id": "casita", "icon": "house", "order": 4, "text": "¿Qué estilo querés para nuestra casita?", "type": "choice", "options": [{"desc": "Cemento a la vista, entrepiso, sillones verdes y vinilos en la pared", "img": "img/casa1.jpg", "label": "Loft industrial"}, {"desc": "Madera, biblioteca de vidrio, plantas y luz dorada de la tarde", "img": "img/casa2.jpg", "label": "Mid-century parisino"}, {"desc": "Lámpara de arco naranja, cromado, tocadiscos y sillón mostaza", "img": "img/casa3.jpg", "label": "Retro setentoso"}, {"desc": "Beige, madera clara, líneas simples y todo en calma", "img": "img/casa4.jpg", "label": "Minimalista cálido"}, {"desc": "Color por todos lados, cuadros, alfombra a cuadros y objetos divertidos", "img": "img/casa5.jpg", "label": "Ecléctico"}, {"desc": "Luminoso y simple, con yute, plantas y toques de color", "img": "img/casa6.jpg", "label": "Nórdico cálido"}]}, {"id": "final", "icon": "heart", "order": 5, "text": "¿Algo más que sueñes para nosotras?", "type": "text", "options": []}];
const META = {"title": "Feliz aniversario mi amorciño", "intro": "Elegí lo que más te guste. No hay respuestas incorrectas."};
/* ===== Guardado con Formspree (reemplaza la base de datos de Claude) ===== */
(function(){
  async function send(payload){
    if(!FORM_URL || FORM_URL.indexOf("formspree.io") < 0){ console.log("Formspree sin configurar", payload); return; }
    for(let intento = 0; intento < 3; intento++){
      try{
        const r = await fetch(FORM_URL, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body: JSON.stringify(payload)});
        if(r.ok) return;
        console.log("Formspree", r.status, await r.text());
      }catch(e){ console.log("Formspree error", e); }
      await new Promise(r => setTimeout(r, 1200));
    }
  }
  function readable(data){
    const out = {_subject: "💌 Respuestas del juego", fecha: new Date().toLocaleString("es-AR")};
    (data.questions||[]).forEach((q,i) => {
      const v = (data.values||{})[q.id], n = (data.values||{})[q.id+"__note"];
      out[(i+1)+". "+q.text] = (v===undefined||v==="") ? "(sin respuesta)" : String(v);
      if(n) out[(i+1)+". Comentario"] = n;
    });
    return out;
  }
  const snap = arr => ({docs: arr.map(d => ({id:d.id, data:() => d}))});
  const db = {
    collection: (p) => ({
      onSnapshot: (cb) => { setTimeout(() => cb(snap(p==="questions" ? QUESTIONS : [])), 0); return () => {}; },
      doc: (id) => ({
        set: async (data) => { window.__ultimas = readable(data); return send(Object.assign({}, window.__ultimas, {_subject: "💌 Respuestas del juego"})); },
        update: async (data) => send(Object.assign({}, window.__ultimas || {}, {_subject: "💍 ¡DIJO QUE SÍ! (con todas sus respuestas)", "💍 RESPUESTA": data.yes, fecha: new Date().toLocaleString("es-AR")}))
      })
    }),
    doc: () => ({ onSnapshot: (cb) => { setTimeout(() => cb({data:() => META}), 0); return () => {}; } })
  };
  const user = {isOwner: async () => false, id: async () => null, profiles: async () => ({})};
  window.claude = {use: async (n) => n==="db" ? db : n==="user" ? user : null};
})();
</script>

  preguntas: buildSong({bpm:108, vol:0.8, hats:true, arp:true,
    chords:["A","C#m","F#m","E","A","C#m","F#m","E"],
    lead:["E5 - C#5 - A4 - C#5 E5","E5 - C#5 - G#4 - C#5 E5","F#5 - E5 - C#5 - A4 -","B4 - C#5 D5 E5 - - -",
          "C#5 - E5 - A5 - G#5 F#5","E5 - - - C#5 - E5 -","F#5 - A5 - F#5 - E5 C#5","E5 - D5 - B4 - G#4 -"]}),
  propuesta: buildSong({bpm:108, vol:0.75, hats:false, arp:true, pad:true,
    chords:["A","D","Bm","F#m","A","D","Bm","F#m","A","D","Bm","F#m","A","Bm","E","A"], lead:[]}),
  festejo: buildSong({bpm:108, vol:0.8, hats:true, arp:true, pad:true,
    chords:["A","D","Bm","F#m","A","D","Bm","F#m","A","D","Bm","F#m","A","Bm","E","A"], lead:[]})
};
function scheduleStep(song, s, t){
  const sd = 60/song.bpm/4, bar = Math.floor(s/16), k = s % 16, [root, iv] = CH[song.chords[bar]];
  const v = song.vol;
  if(k % 4 === 0) tone("tri", root - 12 + (k % 8 === 4 ? 12 : 0), t, sd*3.6, 0.32*v);                 // bajo
  if(song.arp) tone(0.125, root + 12 + iv[k % 3], t, sd*0.85, 0.05*v);                                  // arpegio
  if(song.pad && k === 0) iv.forEach(x => tone("tri", root + x, t, sd*15.5, 0.06*v));                  // colchón
  if(song.hats && k % 2 === 0) noise(t, 0.03, (k % 8 === 4 ? 0.10 : 0.05)*v);                           // hi-hat
  if(song.hats && k % 8 === 0) tone("sq", 36, t, 0.05, 0.08*v);                                          // bombo
  for(const e of song.leadEv) if(e.s === s) tone(0.25, e.m, t, e.d*sd*0.95, 0.12*v);                     // melodía
}
function playSong(name){
  auInit(); if(!AU.ctx) return;
  if(AU.song === SONGS[name]) return;
  stopSong(); AU.song = SONGS[name]; AU.step = 0; AU.next = AU.ctx.currentTime + 0.08;
  AU.timer = setInterval(() => {
    const song = AU.song; if(!song) return;
    while(AU.next < AU.ctx.currentTime + 0.2){
      scheduleStep(song, AU.step, AU.next);
      AU.next += 60/song.bpm/4; AU.step = (AU.step + 1) % song.steps;
    }
  }, 50);
}
function stopSong(){ clearInterval(AU.timer); AU.timer = null; AU.song = null; }
function sfx(kind){
  if(!AU.ctx || !AU.on) return; const t = AU.ctx.currentTime + 0.005;
  if(kind === "type") tone(0.125, 84 + Math.floor(Math.random()*3), t, 0.025, 0.035, AU.master);
  if(kind === "select"){ tone(0.25, 81, t, 0.06, 0.08, AU.master); tone(0.25, 88, t+0.06, 0.09, 0.08, AU.master); }
  if(kind === "next"){ tone(0.25, 76, t, 0.05, 0.06, AU.master); tone(0.25, 81, t+0.05, 0.07, 0.06, AU.master); }
  if(kind === "bark"){ tone("sq", 62, t, 0.05, 0.06, AU.master); tone("sq", 57, t+0.05, 0.07, 0.06, AU.master); noise(t, 0.08, 0.05, AU.master); }
  if(kind === "fanfare"){
    ["A4","C#5","E5","A5"].forEach((n,i) => tone(0.25, NOTE(n), t + i*0.11, 0.1, 0.12, AU.master));
    ["A5","C#6","E6"].forEach(n => tone(0.25, NOTE(n), t + 0.48, 0.9, 0.07, AU.master));
    tone("tri", NOTE("A3"), t + 0.48, 0.9, 0.3, AU.master);
  }
}
function setSound(on){
  AU.on = on; try{ localStorage.setItem("p1p2_sound", on ? "on" : "off"); }catch(e){}
  if(AU.master) AU.master.gain.value = on ? 0.55 : 0;
  const b = document.getElementById("mute"); if(b) b.textContent = on ? "♪ ON" : "♪ OFF";
}

function celebrate(){
  const layer = document.createElement("div");
  layer.style.cssText = "position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8";
  for(let k=0;k<40;k++){
    const sp = document.createElement("span");
    const x = Math.random()*100, d = Math.random()*1.2, sz = [3,4,5][k%3];
    sp.innerHTML = k%5===0 ? sprite("spark",sz) : sprite("mini",sz);
    sp.style.cssText = `position:absolute;left:${x}%;bottom:-40px;animation:burst ${2.2+Math.random()*1.5}s steps(10) ${d}s forwards`;
    layer.appendChild(sp);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 5000);
}

    .map(([l,t,d]) => `<span class="tw" style="left:${l}%;top:${t}%;animation-delay:${d}s">${sprite("spark",3)}</span>`).join("");
  return `<div class="duo" style="--h:${h||300}px"><img class="art" alt="Nosotras dos" src="img/${which}.png">${fx}${tw}</div>`;
}

async function submit(){

  const snap = questions.map(q => ({id:q.id, text:q.text, type:q.type, icon:q.icon||"heart",
    options:(q.options||[]).map(optObj).map(o => ({label:o.label||"", img:o.img||""}))}));
  try{
    const aid = uid();
    await db.collection("answers").doc(aid).set({by:me, at:Date.now(), questions:snap, values:game.vals});
    game.done = true; game.aid = aid; renderPlay(); window.scrollTo(0,0);
  }catch(e){ console.log(e); toast("No se pudo guardar"); btn.disabled=false; btn.textContent="Enviar ♥"; }
}

async function saveQ(id, q, quiet){

});

setSound(AU.on);
(async function init(){
  const timer = setTimeout(() => { if(!loaded.q){ $("#view").className="box center"; $("#view").innerHTML = `<h2>GAME OVER</h2><p class="muted" style="margin-top:10px">No pudimos cargar el juego. Revisá que hayas iniciado sesión y recargá.</p>`; } }, 10000);
  try{ [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); }catch(e){}
  if(!db){ clearTimeout(timer); $("#view").innerHTML = `${sprite("heart",6)}<h2 style="margin-top:14px">INSERT COIN</h2><p class="muted" style="margin-top:10px">Iniciá sesión para jugar y que se guarden tus respuestas.</p>`; return; }
  try{ isOwner = (user && await user.isOwner()) || false; }catch(e){}
  try{ me = user ? await user.id() : null; }catch(e){}
  if(isOwner){
    $("#tabs").classList.remove("hidden");
    try{ assets = await claude.use("assets"); }catch(e){}
  }
  const busy = () => (tab==="play" && game) || (tab==="edit" && document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  db.collection("questions").onSnapshot(s => {
    clearTimeout(timer);
    questions = norm(s).sort((a,b) => (a.order??0)-(b.order??0));
    loaded.q = true; if(!busy()) render();
  }, e => console.log(e));
  db.doc("settings/meta").onSnapshot(s => {
    meta = docData(s) || {}; loaded.m = true; if(!busy() && tab!=="edit") render();
  }, e => { loaded.m = true; render(); });
  if(isOwner){
    db.collection("answers").onSnapshot(s => { answers = norm(s); if(tab==="answers") render(); }, e => console.log(e));
  }
})();
</script>
</body>
